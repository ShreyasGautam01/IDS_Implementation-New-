[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ids-reliability-rebuild"
version = "2.0.0"
description = "Auditable temporal intrusion-detection reliability experiments"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
  "PyYAML>=6,<7",
  "pyarrow>=14,<24",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
ids-reliability = "ids_reliability.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv]
default-groups = ["dev"]
