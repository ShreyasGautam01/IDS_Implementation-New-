<svg xmlns="http://www.w3.org/2000/svg" width="178mm" height="90mm" viewBox="0 0 672.76 340.16" role="img" aria-labelledby="title desc">
<title id="title">Unknown-family ranking differs sharply by score</title>
<desc id="desc">AUROC comparison for 36 held-out Worms flows versus 353,853 known flows. Mahalanobis-Weibull AUROC is below chance at 0.216. Maximum-probability mean AUROC is about 0.971 across four seeds.</desc>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<style>text{font-family:Arial,Helvetica,Inter,"DejaVu Sans",sans-serif;fill:#171717}.muted{fill:#5E6462}.grid{stroke:#E8E8E5;stroke-width:1}.axis{stroke:#AEB3B0;stroke-width:1}.risk{stroke:#C84B31;fill:#C84B31}.teal{stroke:#1F6F5F;fill:#1F6F5F}.whisker{stroke-width:1.4;stroke-linecap:round}.tick{font-size:11px}.label{font-size:11.3px}</style>
<text x="18" y="28" font-size="14" font-weight="600">Unknown-family ranking differs sharply by score</text>
<text class="muted" x="18" y="49" font-size="10.5">Held-out Worms (n=36) versus known traffic (n=353,853) in one locked future window.</text>
<line class="grid" x1="200.00" y1="134" x2="200.00" y2="251"/>
<text class="tick muted" x="200.00" y="271" text-anchor="middle">0.00</text>
<line class="grid" x1="292.00" y1="134" x2="292.00" y2="251"/>
<text class="tick muted" x="292.00" y="271" text-anchor="middle">0.25</text>
<line class="grid" x1="384.00" y1="134" x2="384.00" y2="251"/>
<text class="tick muted" x="384.00" y="271" text-anchor="middle">0.50</text>
<line class="grid" x1="476.00" y1="134" x2="476.00" y2="251"/>
<text class="tick muted" x="476.00" y="271" text-anchor="middle">0.75</text>
<line class="grid" x1="568.00" y1="134" x2="568.00" y2="251"/>
<text class="tick muted" x="568.00" y="271" text-anchor="middle">1.00</text>
<line x1="384.00" y1="134" x2="384.00" y2="251" stroke="#8D8D88" stroke-width="1.1" stroke-dasharray="4 3"/>
<text x="389.00" y="128" class="muted" font-size="9.5">chance</text>
<text class="label" x="18" y="165">Mahalanobis-Weibull (fixed split)</text>
<line class="risk whisker" x1="279.37" y1="161" x2="279.37" y2="161"/>
<line class="risk" x1="279.37" y1="157" x2="279.37" y2="165"/>
<line class="risk" x1="279.37" y1="157" x2="279.37" y2="165"/>
<circle class="risk" cx="279.37" cy="161" r="4"/>
<text x="585" y="165" font-size="11.2" font-weight="600">0.216</text>
<text class="label" x="18" y="224">Maximum probability (mean across 4 seeds)</text>
<line class="teal whisker" x1="556.73" y1="220" x2="558.14" y2="220"/>
<line class="teal" x1="556.73" y1="216" x2="556.73" y2="224"/>
<line class="teal" x1="558.14" y1="216" x2="558.14" y2="224"/>
<circle class="teal" cx="557.43" cy="220" r="4"/>
<text x="585" y="224" font-size="11.2" font-weight="600">0.971 ± 0.002</text>
<line class="axis" x1="200" y1="251" x2="568" y2="251"/>
<text class="muted" x="384" y="292" text-anchor="middle" font-size="10.5">AUROC (higher is better)</text>
<text class="muted" x="18" y="307" font-size="9.5">Whiskers show sample SD for maximum probability across seeds; they are not confidence intervals.</text>
<text class="muted" x="18" y="319" font-size="9.5">The Weibull score is identical across seeds on this split. AUROC below 0.5 indicates an inverted ranking.</text>
</svg>

